<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Factura · Santiago León</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --amber: #F5A623;
  --amber-light: #FEF3DC;
  --amber-dark: #C47F0A;
  --text: #1C1C1E;
  --text-muted: #8E8E93;
  --border: #E5E5EA;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --red: #FF3B30;
  --green: #34C759;
}

body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 100px;
}

/* ── HEADER ── */
.header {
  background: var(--card);
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky; top: 0; z-index: 50;
}

.lion-icon {
  width: 40px; height: 40px;
  background: var(--amber);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}

.header-text h1 {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 17px; color: var(--text); letter-spacing: -0.3px;
}

.header-text p {
  font-size: 11px; color: var(--text-muted); margin-top: 1px;
}

/* ── TABS ── */
.tab-bar {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 72px; z-index: 40;
}

.tab-btn {
  flex: 1; padding: 12px 8px 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--text-muted);
  background: none; border: none;
  border-bottom: 2.5px solid transparent;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}

.tab-btn.active {
  color: var(--amber-dark);
  border-bottom-color: var(--amber);
  font-weight: 600;
}

.tab-btn svg {
  width: 16px; height: 16px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── SECTION / FIELD (shared) ── */
.section {
  margin: 14px 14px 0;
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.section-title {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.6px; text-transform: uppercase;
  padding: 12px 14px 6px;
}

.field { padding: 0 14px 12px; }
.field + .field { border-top: 1px solid var(--border); padding-top: 12px; }

.field label {
  display: block; font-size: 11px; font-weight: 500;
  color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.2px;
}

.input-wrap { display: flex; gap: 8px; align-items: center; }

input[type="text"],
input[type="number"],
input[type="email"],
input[type="tel"] {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 400;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

input:focus { border-color: var(--amber); background: #FFFBF2; }

input.auto-calc { color: var(--text-muted); font-weight: 300; }
input.auto-calc:focus { color: var(--text); font-weight: 400; }

/* ── MIC BUTTON ── */
.mic {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.15s;
}

.mic:active { transform: scale(0.93); }
.mic.listening { background: var(--amber); border-color: var(--amber); animation: pulse 1s ease-in-out infinite; }
.mic.listening svg { stroke: white; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,166,35,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(245,166,35,0); }
}

.mic svg {
  width: 16px; height: 16px;
  stroke: var(--text-muted); fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* ── RESET (auto-calc) BUTTON ── */
.reset-calc {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1.5px solid rgba(245,166,35,0.4);
  background: var(--amber-light);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  font-size: 17px; color: var(--amber-dark);
  transition: all 0.15s;
  opacity: 0; pointer-events: none;
}
.reset-calc.visible { opacity: 1; pointer-events: all; }
.reset-calc:active { transform: scale(0.93); background: var(--amber); color: white; }

/* ── TOTALS SECTION ── */
.totals-section {
  margin: 14px 14px 0;
  background: var(--amber-light);
  border-radius: 14px; overflow: hidden;
  border: 1px solid rgba(245,166,35,0.25);
}

.totals-section .section-title { color: var(--amber-dark); }
.totals-section .field label { color: var(--amber-dark); }
.totals-section input { background: rgba(255,255,255,0.7); border-color: rgba(245,166,35,0.3); }
.totals-section input:focus { background: white; border-color: var(--amber); }

.field.total-field input {
  font-weight: 600; font-size: 17px;
  color: var(--amber-dark);
  background: white; border-color: var(--amber);
}

/* ── STATUS BAR ── */
.status-bar {
  margin: 10px 14px 0;
  padding: 10px 14px;
  background: rgba(245,166,35,0.12);
  border-radius: 10px; font-size: 12px;
  color: var(--amber-dark); text-align: center;
  min-height: 36px; display: flex;
  align-items: center; justify-content: center;
  transition: opacity 0.2s;
}

.status-bar.hidden { opacity: 0; pointer-events: none; }

/* ── BUTTONS ── */
.btn-primary {
  margin: 16px 14px 0;
  width: calc(100% - 28px);
  padding: 15px;
  background: var(--amber); color: white;
  border: none; border-radius: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s, transform 0.1s;
}

.btn-primary:active { background: var(--amber-dark); transform: scale(0.98); }

.btn-primary svg {
  width: 17px; height: 17px;
  stroke: white; fill: none;
  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}

.hint {
  font-size: 11px; color: var(--text-muted);
  text-align: center; margin-top: 8px;
}

/* ── CLIENT SELECTOR (on invoice tab) ── */
.client-selector {
  margin: 14px 14px 0;
  background: var(--card);
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border);
}

.client-selector-header {
  padding: 12px 14px 8px;
  display: flex; align-items: center; justify-content: space-between;
}

.client-selector-header span {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted); letter-spacing: 0.6px; text-transform: uppercase;
}

.client-selector-header button {
  font-size: 12px; font-weight: 600;
  color: var(--amber-dark); background: none; border: none;
  cursor: pointer; padding: 0;
}

.client-select-list {
  padding: 0 14px 12px;
  display: flex; flex-wrap: wrap; gap: 8px;
}

.client-chip {
  padding: 6px 12px;
  background: var(--amber-light);
  border: 1.5px solid rgba(245,166,35,0.4);
  border-radius: 20px;
  font-size: 13px; font-weight: 500;
  color: var(--amber-dark);
  cursor: pointer; transition: all 0.15s;
}

.client-chip:active, .client-chip.selected {
  background: var(--amber);
  color: white;
  border-color: var(--amber);
}

.client-empty-hint {
  padding: 0 14px 14px;
  font-size: 13px; color: var(--text-muted);
}

/* ── CLIENTS PANEL ── */
.clients-header {
  padding: 14px 14px 0;
}

.search-input-wrap {
  position: relative; margin-bottom: 0;
}

.search-input-wrap input {
  padding-left: 36px !important;
}

.search-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;
  stroke: var(--text-muted); fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  pointer-events: none;
}

/* Client cards */
.clients-list {
  padding: 14px 14px 0;
  display: flex; flex-direction: column; gap: 10px;
}

.client-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.client-card-header {
  padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
}

.client-avatar {
  width: 38px; height: 38px;
  background: var(--amber-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
  color: var(--amber-dark);
  flex-shrink: 0;
}

.client-card-info { flex: 1; min-width: 0; }

.client-card-name {
  font-size: 14px; font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.client-card-nie {
  font-size: 12px; color: var(--text-muted); margin-top: 1px;
}

.client-card-actions {
  display: flex; gap: 6px;
}

.client-action-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}

.client-action-btn svg {
  width: 15px; height: 15px;
  stroke: var(--text-muted); fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

.client-action-btn.use-btn {
  background: var(--amber-light);
  border-color: rgba(245,166,35,0.4);
}

.client-action-btn.use-btn svg { stroke: var(--amber-dark); }

.client-action-btn.del-btn:active { background: #FFF0EF; border-color: var(--red); }
.client-action-btn.del-btn:active svg { stroke: var(--red); }

.client-card-details {
  padding: 0 14px 12px;
  border-top: 1px solid var(--border);
  margin-top: 0;
  font-size: 12px; color: var(--text-muted);
  display: flex; flex-direction: column; gap: 3px;
}

.clients-empty {
  margin: 40px 14px;
  text-align: center;
  color: var(--text-muted);
}

.clients-empty svg {
  width: 48px; height: 48px;
  stroke: var(--border); fill: none;
  stroke-width: 1.5; margin-bottom: 12px;
}

.clients-empty p { font-size: 14px; }
.clients-empty small { font-size: 12px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}

.modal-overlay.open {
  opacity: 1; pointer-events: all;
}

.modal-sheet {
  width: 100%;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 0 0 40px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  max-height: 92vh;
  overflow-y: auto;
}

.modal-overlay.open .modal-sheet {
  transform: translateY(0);
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
}

.modal-title {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 18px; color: var(--text);
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.modal-field {
  padding: 14px 16px 0;
}

.modal-field label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text-muted); letter-spacing: 0.4px;
  text-transform: uppercase; margin-bottom: 6px;
}

.modal-actions {
  display: flex; gap: 10px;
  padding: 20px 16px 0;
}

.btn-save {
  flex: 1; padding: 14px;
  background: var(--amber); color: white;
  border: none; border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}

.btn-save:active { background: var(--amber-dark); }

.btn-cancel {
  flex: 0 0 90px; padding: 14px;
  background: var(--bg); color: var(--text-muted);
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 500;
  cursor: pointer;
}

</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="lion-icon">🦁</div>
  <div class="header-text">
    <h1>Santiago León</h1>
    <p id="tab-subtitle">Nueva factura</p>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-invoice-btn" onclick="switchTab('invoice')">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Factura
  </button>
  <button class="tab-btn" id="tab-clients-btn" onclick="switchTab('clients')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Clientes
    <span id="client-count-badge" style="display:none;background:var(--amber);color:white;border-radius:10px;padding:1px 6px;font-size:11px;"></span>
  </button>
</div>

<!-- ═══════════════ PANEL: INVOICE ═══════════════ -->
<div class="panel active" id="panel-invoice">

  <!-- Client quick-select -->
  <div class="client-selector">
    <div class="client-selector-header">
      <span>Cliente</span>
      <button onclick="switchTab('clients')">Gestionar →</button>
    </div>
    <div id="client-chips-wrap">
      <div class="client-empty-hint">No hay clientes guardados. <b style="color:var(--amber-dark);cursor:pointer;" onclick="switchTab('clients')">Añadir →</b></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Datos de factura</div>

    <div class="field">
      <label>Número de factura</label>
      <div class="input-wrap">
        <input type="text" id="num" placeholder="AB-2026-007">
        <button class="mic" id="mic-num" onclick="startVoice('num')">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Fecha de emisión</label>
      <div class="input-wrap">
        <input type="text" id="fecha" placeholder="27/03/2026">
        <button class="mic" id="mic-fecha" onclick="startVoice('fecha')">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Precio unitario (€)</label>
      <div class="input-wrap">
        <input type="number" id="precio" placeholder="0.00" step="0.01" oninput="calcFromPrecio()">
        <button class="mic" id="mic-precio" onclick="startVoice('precio')">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="totals-section">
    <div class="section-title">Totales (editables)</div>
    <div class="field">
      <label>Base imponible (€)</label>
      <input type="number" id="base" class="auto-calc" placeholder="0.00" step="0.01" oninput="calcFromBase()">
    </div>
    <div class="field">
      <label>IVA 21% (€)</label>
      <div class="input-wrap">
        <input type="number" id="iva" class="auto-calc" placeholder="0.00" step="0.01" oninput="onIvaManual()">
        <button class="reset-calc" id="iva-reset" onclick="resetIva()" title="Recalcular auto">↺</button>
      </div>
    </div>
    <div class="field total-field">
      <label>Total a pagar (€)</label>
      <div class="input-wrap">
        <input type="number" id="total" placeholder="0.00" step="0.01" oninput="onTotalManual()">
        <button class="reset-calc" id="total-reset" onclick="resetTotal()" title="Recalcular auto">↺</button>
      </div>
    </div>
  </div>

  <div class="status-bar hidden" id="status"></div>

  <button class="btn-primary" onclick="generatePDF()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    Descargar PDF
  </button>
  <p class="hint">El PDF se genera en tu dispositivo · Sin servidor</p>
</div>

<!-- ═══════════════ PANEL: CLIENTS ═══════════════ -->
<div class="panel" id="panel-clients">
  <div class="clients-header">
    <div class="search-input-wrap" style="margin-top:14px;">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="client-search" placeholder="Buscar cliente..." oninput="renderClientList()">
    </div>
  </div>

  <div id="clients-list-wrap" class="clients-list"></div>

  <button class="btn-primary" onclick="openClientModal(null)">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nuevo cliente
  </button>
</div>

<!-- ═══════════════ MODAL: ADD/EDIT CLIENT ═══════════════ -->
<div class="modal-overlay" id="client-modal" onclick="closeModalOnOverlay(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title-text">Nuevo cliente</div>

    <div class="modal-field">
      <label>Nombre / Empresa</label>
      <input type="text" id="cl-nombre" placeholder="NEKO-NOMI, S.L.">
    </div>
    <div class="modal-field">
      <label>NIE / CIF</label>
      <input type="text" id="cl-nie" placeholder="B56937113">
    </div>
    <div class="modal-field">
      <label>Dirección</label>
      <input type="text" id="cl-dir" placeholder="Ctra. Castellón-Alcora, km.21, 12110 Alcora">
    </div>
    <div class="modal-field">
      <label>Email</label>
      <input type="email" id="cl-email" placeholder="contabilidad@empresa.es">
    </div>
    <div class="modal-field">
      <label>Teléfono</label>
      <input type="tel" id="cl-tel" placeholder="+34 600 000 000">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeClientModal()">Cancelar</button>
      <button class="btn-save" onclick="saveClient()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── TELEGRAM ──
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// ── DATE ──
const today = new Date();
document.getElementById('fecha').value = today.toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});

// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab + '-btn').classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-subtitle').textContent = tab === 'invoice' ? 'Nueva factura' : 'Mis clientes';
  if (tab === 'clients') renderClientList();
}

// ── CALC ──
let ivaManual = false, totalManual = false;

function setAutoStyle(id, isAuto) {
  const el = document.getElementById(id);
  if (isAuto) { el.classList.add('auto-calc'); } else { el.classList.remove('auto-calc'); }
}
function showReset(fieldId, show) {
  const btn = document.getElementById(fieldId + '-reset');
  if (btn) { show ? btn.classList.add('visible') : btn.classList.remove('visible'); }
}

function calcFromPrecio() {
  const p = parseFloat(document.getElementById('precio')?.value) || 0;

  if (typeof set === 'function') set('base', p.toFixed(2));

  const iva = Math.round(p * 0.21 * 100) / 100;
  const total = Math.round((p + iva) * 100) / 100;

  if (typeof ivaManual === 'undefined' || !ivaManual) {
    if (typeof set === 'function') set('iva', iva.toFixed(2));
    if (typeof setAutoStyle === 'function') setAutoStyle('iva', true);
  }

  if (typeof totalManual === 'undefined' || !totalManual) {
    if (typeof set === 'function') set('total', total.toFixed(2));
    if (typeof setAutoStyle === 'function') setAutoStyle('total', true);
  }
}
  if (!totalManual) { set('total', total.toFixed(2)); setAutoStyle('total', true); }
}
function calcFromBase() {
  const base = parseFloat(document.getElementById('base').value) || 0;
  const iva   = ivaManual   ? (parseFloat(document.getElementById('iva').value) || 0)
                             : Math.round(base * 0.21 * 100) / 100;
  const total = Math.round((base + iva) * 100) / 100;
  if (!ivaManual)   { set('iva',   iva.toFixed(2));   setAutoStyle('iva', true); }
  if (!totalManual) { set('total', total.toFixed(2)); setAutoStyle('total', true); }
}
function onIvaManual() {
  ivaManual = true;
  setAutoStyle('iva', false);
  showReset('iva', true);
  // Recalc total from base + new iva (unless total is also manual)
  if (!totalManual) {
    const base = parseFloat(document.getElementById('base').value) || 0;
    const iva  = parseFloat(document.getElementById('iva').value)  || 0;
    set('total', (Math.round((base + iva) * 100) / 100).toFixed(2));
    setAutoStyle('total', true);
  }
}
function onTotalManual() {
  totalManual = true;
  setAutoStyle('total', false);
  showReset('total', true);
}
function resetIva() {
  ivaManual = false;
  showReset('iva', false);
  setAutoStyle('iva', true);
  calcFromBase();
}
function resetTotal() {
  totalManual = false;
  showReset('total', false);
  setAutoStyle('total', true);
  const base = parseFloat(document.getElementById('base').value) || 0;
  const iva  = parseFloat(document.getElementById('iva').value)  || 0;
  set('total', (Math.round((base + iva) * 100) / 100).toFixed(2));
}
function calcFromIva() { onIvaManual(); }
function set(id, val) { document.getElementById(id).value = val; }

// ── VOICE ──
let recognition = null, activeField = null;
function startVoice(fieldId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showStatus('Голосовой ввод не поддерживается', true); return; }
  if (recognition && activeField === fieldId) { recognition.stop(); return; }
  if (recognition) recognition.stop();
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = false;
  activeField = fieldId;
  document.querySelectorAll('.mic').forEach(b => b.classList.remove('listening'));
  document.getElementById('mic-' + fieldId).classList.add('listening');
  showStatus('Escuchando...');
  recognition.onresult = (e) => {
    let t = e.results[0][0].transcript.trim();
    if (['precio','base','iva','total'].includes(fieldId)) {
      t = t.replace(/euros?/gi,'').replace(/,/g,'.').replace(/[^\d.]/g,'');
      const num = parseFloat(t);
      if (!isNaN(num)) t = num.toString();
    }
    document.getElementById(fieldId).value = t;
    if (fieldId === 'precio') calcFromPrecio();
    else if (fieldId === 'base') calcFromBase();
    else if (fieldId === 'iva') calcFromIva();
    showStatus('Listo: ' + t);
  };
  recognition.onerror = (e) => { showStatus('Error: ' + e.error, true); resetMics(); };
  recognition.onend = () => { resetMics(); };
  recognition.start();
}
function resetMics() {
  document.querySelectorAll('.mic').forEach(b => b.classList.remove('listening'));
  recognition = null; activeField = null;
}
function showStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg; el.classList.remove('hidden');
  el.style.color = isErr ? 'var(--red)' : 'var(--amber-dark)';
  el.style.background = isErr ? 'rgba(255,59,48,0.08)' : 'rgba(245,166,35,0.12)';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 3000);
}

// ── CLIENTS DATA ──
// ═══════════════════════════════════════
function loadClients() {
  try { return JSON.parse(localStorage.getItem('sl_clients') || '[]'); }
  catch { return []; }
}
function saveClients(arr) {
  localStorage.setItem('sl_clients', JSON.stringify(arr));
}

let editingClientId = null;

function openClientModal(id) {
  editingClientId = id;
  const modal = document.getElementById('client-modal');
  if (id !== null) {
    const clients = loadClients();
    const c = clients.find(x => x.id === id);
    if (c) {
      document.getElementById('modal-title-text').textContent = 'Editar cliente';
      document.getElementById('cl-nombre').value = c.nombre || '';
      document.getElementById('cl-nie').value    = c.nie    || '';
      document.getElementById('cl-dir').value    = c.dir    || '';
      document.getElementById('cl-email').value  = c.email  || '';
      document.getElementById('cl-tel').value    = c.tel    || '';
    }
  } else {
    document.getElementById('modal-title-text').textContent = 'Nuevo cliente';
    ['cl-nombre','cl-nie','cl-dir','cl-email','cl-tel'].forEach(id => document.getElementById(id).value = '');
  }
  modal.classList.add('open');
  setTimeout(() => document.getElementById('cl-nombre').focus(), 350);
}

function closeClientModal() {
  document.getElementById('client-modal').classList.remove('open');
  editingClientId = null;
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('client-modal')) closeClientModal();
}

function saveClient() {
  const nombre = document.getElementById('cl-nombre').value.trim();
  if (!nombre) { document.getElementById('cl-nombre').focus(); return; }
  const c = {
    id:     editingClientId || Date.now().toString(),
    nombre: nombre,
    nie:    document.getElementById('cl-nie').value.trim(),
    dir:    document.getElementById('cl-dir').value.trim(),
    email:  document.getElementById('cl-email').value.trim(),
    tel:    document.getElementById('cl-tel').value.trim(),
  };
  const clients = loadClients();
  const idx = clients.findIndex(x => x.id === c.id);
  if (idx >= 0) clients[idx] = c; else clients.push(c);
  saveClients(clients);
  closeClientModal();
  renderClientList();
  renderClientChips();
}

function deleteClient(id) {
  const clients = loadClients().filter(x => x.id !== id);
  saveClients(clients);
  renderClientList();
  renderClientChips();
}

function useClient(c) {
  // Fill the "Datos del cliente" section in PDF generation (stored in hidden inputs)
  document.getElementById('cl-pdf-nombre').value = c.nombre;
  document.getElementById('cl-pdf-nie').value    = c.nie;
  document.getElementById('cl-pdf-dir').value    = c.dir;
  // Show feedback
  document.querySelectorAll('.client-chip').forEach(ch => ch.classList.remove('selected'));
  const chip = document.querySelector(`.client-chip[data-id="${c.id}"]`);
  if (chip) chip.classList.add('selected');
  showStatus('✓ Cliente: ' + c.nombre);
}

// ── RENDER CLIENT CHIPS (invoice tab) ──
function renderClientChips() {
  const wrap = document.getElementById('client-chips-wrap');
  const clients = loadClients();
  const badge = document.getElementById('client-count-badge');
  
  if (clients.length === 0) {
    badge.style.display = 'none';
    wrap.innerHTML = `<div class="client-empty-hint">No hay clientes guardados. <b style="color:var(--amber-dark);cursor:pointer;" onclick="switchTab('clients')">Añadir &rarr;</b></div>`;
    return;
  }
  
  badge.style.display = '';
  badge.textContent = clients.length;
  
  wrap.innerHTML = '<div class="client-select-list">' +
    clients.map(c => `<div class="client-chip" data-id="${c.id}" onclick="useClient(${JSON.stringify(c).replace(/'/g, '&#39;')})">
      ${c.nombre}
    </div>`).join('') +
    '</div>';
}

// ── RENDER CLIENT LIST (clients tab) ──
function renderClientList() {
  const wrap = document.getElementById('clients-list-wrap');
  const q = (document.getElementById('client-search')?.value || '').toLowerCase();
  let clients = loadClients();
  if (q) clients = clients.filter(c =>
    c.nombre.toLowerCase().includes(q) ||
    (c.nie || '').toLowerCase().includes(q)
  );
  
  if (clients.length === 0) {
    wrap.innerHTML = `<div class="clients-empty">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>No hay clientes</p>
      <small>Pulsa "Nuevo cliente" para añadir</small>
    </div>`;
    return;
  }
  
  wrap.innerHTML = clients.map(c => {
    const initials = c.nombre.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const details = [c.dir, c.email, c.tel].filter(Boolean);
    return `<div class="client-card">
      <div class="client-card-header">
        <div class="client-avatar">${initials}</div>
        <div class="client-card-info">
          <div class="client-card-name">${c.nombre}</div>
          ${c.nie ? `<div class="client-card-nie">${c.nie}</div>` : ''}
        </div>
        <div class="client-card-actions">
          <button class="client-action-btn use-btn" title="Usar en factura" onclick="useClientFromList(${JSON.stringify(c).replace(/"/g,'&quot;')})">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </button>
          <button class="client-action-btn" title="Editar" onclick="openClientModal('${c.id}')">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="client-action-btn del-btn" title="Eliminar" onclick="if(confirm('¿Eliminar ${c.nombre.replace(/'/g,'\\&#39;')}?')) deleteClient('${c.id}')">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
      ${details.length ? `<div class="client-card-details">${details.map(d=>`<span>${d}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function useClientFromList(c) {
  useClient(c);
  switchTab('invoice');
  showStatus('✓ Cliente seleccionado: ' + c.nombre);
}

function generatePDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    showStatus('Cargando librería PDF, intenta de nuevo en 2 segundos...', true);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => showStatus('Listo, pulsa de nuevo el botón');
    document.head.appendChild(s);
    return;
  }
  const { jsPDF } = window.jspdf;

  const num    = document.getElementById('num').value.trim() || 'AB-2026-007';
  const fecha  = document.getElementById('fecha').value.trim() || '';
  const precio = parseFloat(document.getElementById('precio').value) || 0;
  const base   = parseFloat(document.getElementById('base').value) || precio;
  const iva    = parseFloat(document.getElementById('iva').value) || 0;
  const total  = parseFloat(document.getElementById('total').value) || 0;

  const fmt = (n) => n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';

  // Colors
  const BOLD    = [40,  40,  40];   // #282828
  const MUTED   = [102, 102, 102];  // #666666
  const AMBER   = [245, 166, 35];
  const AMBERLG = [254, 243, 220];

  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210; const M = 15;

  // ── AMBER HEADER STRIP ──
  doc.setFillColor(...AMBER);
  doc.rect(0, 0, W, 38, 'F');

  // Left side text in header — bold #282828
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(...BOLD);
  doc.text('Fecha de emisión: ', M, 13);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...BOLD);
  doc.text(fecha, M + doc.getTextWidth('Fecha de emisión: '), 13);

  doc.setFont('helvetica', 'bold');
  doc.text('Factura Nº: ', M, 20);
  doc.setFont('helvetica', 'normal');
  doc.text(num, M + doc.getTextWidth('Factura Nº: '), 20);

  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...BOLD);
  doc.text('SANTIAGO LEON', W - M - 26, 17, { align: 'right' });

  // Lion image — right side of header
  try {
    doc.addImage(LION_IMG, 'PNG', W - M - 24, 1, 24, 36);
  } catch(e) { /* skip if fails */ }

  // ── EMISOR INFO ──
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...BOLD);
  doc.text('Santiago León', M, 48);

  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...MUTED);
  doc.text('NIE Y8772642L', M, 54);
  doc.text('Avenida del Mar, 11, entresuelo B, 12003, Castellón de la Plana, España', M, 60);
  doc.text('Teléfono: +34 647258332', M, 66);

  // ── DIVIDER ──
  doc.setDrawColor(220, 220, 220);
  doc.setLineWidth(0.3);
  doc.line(M, 71, W - M, 71);

  // ── TWO COLUMNS LABELS ──
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...BOLD);
  doc.text('Datos del emisor (Autónomo):', M, 80);
  doc.text('Datos del cliente:', 110, 80);

  const labelCol = (x, y, label, value) => {
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...BOLD);
    doc.text(label, x, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...MUTED);
    doc.text(value, x + doc.getTextWidth(label) + 1, y);
  };

  labelCol(M,   88, 'Forma de pago: ', 'Transferencia bancaria');
  labelCol(M,   94, 'IBAN: ',          'ES46 0182 5319 7702 0284 0648');
  labelCol(M,  100, 'BIC: ',           'BBVAESMM');
  labelCol(M,  106, 'Plazo de pago: ', '45 días');

  const sc = window._selectedClient;
  const cNombre = sc ? sc.nombre : 'NEKO-NOMI, S.L.';
  const cNie    = sc ? sc.nie    : 'B56937113';
  const cDir    = sc ? sc.dir    : 'CTRA. CASTELLON-ALCORA, KM.21, 12110 ALCORA, SPAIN';

  labelCol(110, 88, 'Nombre / Empresa: ', cNombre);
  labelCol(110, 94, 'NIE / CIF: ', cNie);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...BOLD);
  doc.text('Dirección: ', 110, 100);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...MUTED);
  // Wrap direction text if too long
  const dirLines = doc.splitTextToSize(cDir, 70);
  doc.text(dirLines[0] || '', 110 + doc.getTextWidth('Dirección: ') + 1, 100);
  if (dirLines[1]) doc.text(dirLines[1], 110, 106);

  // ── CONCEPTO LABEL ──
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...BOLD);
  doc.text('Concepto:', M, 118);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...MUTED);
  doc.text('Servicios de gestión de compras', M, 124);

  // ── ITEMS TABLE ──
  const tY = 132;
  // Header row — amber bg + #282828 bold text
  doc.setFillColor(...AMBER);
  doc.rect(M, tY, W - 2*M, 9, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(...BOLD);
  doc.text('Nº',                  M+2,   tY+6);
  doc.text('Concepto',            M+10,  tY+6);
  doc.text('Cantidad',            M+100, tY+6);
  doc.text('Precio Unitario (€)', M+120, tY+6);
  doc.text('Total (€)',           M+162, tY+6);

  // Data row
  doc.setFillColor(...AMBERLG);
  doc.rect(M, tY+9, W-2*M, 9, 'F');
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...MUTED);
  doc.text('1',                              M+2,   tY+15);
  doc.text('Servicios de gestión de compras',M+10,  tY+15);
  doc.text('1',                              M+104, tY+15);
  doc.text(fmt(precio),                      M+120, tY+15);
  doc.text(fmt(precio),                      M+162, tY+15);

  // Empty row
  doc.setDrawColor(220, 220, 220);
  doc.setLineWidth(0.2);
  doc.rect(M, tY+18, W-2*M, 9);

  // ── TOTALS TABLE ──
  const totY = tY + 34;
  // Header row — amber bg + #282828 bold text
  doc.setFillColor(...AMBER);
  doc.rect(M, totY, W-2*M, 9, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(...BOLD);
  doc.text('Nº',             M+2,   totY+6);
  doc.text('Base imponible:', M+10,  totY+6);
  doc.text('IVA 21%:',       M+90,  totY+6);
  doc.text('Total a pagar:', M+140, totY+6);

  // Data row
  doc.setFillColor(...AMBERLG);
  doc.rect(M, totY+9, W-2*M, 9, 'F');
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...MUTED);
  doc.text('1',         M+2,   totY+15);
  doc.text(fmt(base),  M+10,  totY+15);
  doc.text(fmt(iva),   M+90,  totY+15);
  doc.text(fmt(total), M+140, totY+15);

  doc.rect(M, totY+18, W-2*M, 9);

  const filename = 'Factura_' + num.replace(/[^a-zA-Z0-9\-]/g,'_') + '_' + fecha.replace(/\//g,'-') + '.pdf';
  try {
    const pdfBlob = doc.output('blob');
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    showStatus('✅ PDF descargado: ' + filename);
  } catch(e) {
    try {
      
const blob = doc.output('blob');
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = filename;
document.body.appendChild(a);
a.click();
setTimeout(() => {
  URL.revokeObjectURL(url);
  a.remove();
}, 100);

      showStatus('✅ PDF guardado: ' + filename);
    } catch(e2) {
      const pdfBlob = doc.output('blob');
      const url = URL.createObjectURL(pdfBlob);
      window.open(url, '_blank');
      showStatus('✅ PDF abierto en nueva pestaña');
    }
  }
}
// Patch generatePDF to use selected client
const _origGenPDF = generatePDF;
generatePDF = function() {
  // Store original client fields, override with selected client if any
  const selNombre = document.getElementById('cl-pdf-nombre').value.trim();
  const selNie    = document.getElementById('cl-pdf-nie').value.trim();
  const selDir    = document.getElementById('cl-pdf-dir').value.trim();
  window._selectedClient = selNombre ? {nombre:selNombre, nie:selNie, dir:selDir} : null;
  _origGenPDF();
};

function deleteClientConfirm(id, name) {
  try {
    if (window.Telegram && Telegram.WebApp) {
      if (typeof showStatus === 'function') {
        showStatus('Eliminar: ' + name + '? Pulsa otra vez para confirmar');
      }
      setTimeout(() => deleteClient(id), 1200);
    } else {
      if (confirm('¿Eliminar ' + name + '?')) deleteClient(id);
    }
  } catch(e) {
    console.error(e);
    deleteClient(id);
  }
}
