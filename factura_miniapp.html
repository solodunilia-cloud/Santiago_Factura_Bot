<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Factura · Santiago León</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --amber: #F5A623;
  --amber-light: #FEF3DC;
  --amber-dark: #C47F0A;
  --text: #1C1C1E;
  --text-muted: #8E8E93;
  --border: #E5E5EA;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --red: #FF3B30;
}
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: 60px;
}
.header {
  background: var(--amber); padding: 20px 20px 16px;
  display: flex; align-items: center; gap: 12px;
}
.lion-icon {
  width: 44px; height: 44px;
  background: rgba(255,255,255,0.25); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.header-text h1 { font-family: 'DM Serif Display', Georgia, serif; font-size: 19px; color: white; }
.header-text p { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 1px; }

.tabs {
  display: flex; background: var(--card);
  border-bottom: 1px solid var(--border); padding: 0 16px;
}
.tab {
  flex: 1; padding: 12px 0; font-size: 13px; font-weight: 500;
  color: var(--text-muted); background: none; border: none;
  border-bottom: 2px solid transparent; cursor: pointer; text-align: center;
}
.tab.active { color: var(--amber-dark); border-bottom-color: var(--amber); }

.page { display: none; }
.page.active { display: block; }

.section {
  margin: 16px 16px 0; background: var(--card);
  border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
}
.section-title {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  letter-spacing: 0.6px; text-transform: uppercase; padding: 14px 16px 8px;
}
.field { padding: 0 16px 14px; }
.field + .field { border-top: 1px solid var(--border); padding-top: 14px; }
.field label { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
.input-wrap { display: flex; gap: 8px; align-items: center; }
input[type="text"], input[type="number"] {
  width: 100%; padding: 10px 12px;
  background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text);
  outline: none; transition: border-color 0.15s; -webkit-appearance: none;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input:focus { border-color: var(--amber); background: #FFFBF2; }

.mic {
  width: 40px; height: 40px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.15s;
}
.mic:active { transform: scale(0.93); }
.mic.listening { background: var(--amber); border-color: var(--amber); animation: pulse 1s ease-in-out infinite; }
.mic.listening svg { stroke: white; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,166,35,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(245,166,35,0); }
}
.mic svg { width: 16px; height: 16px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.totals-section {
  margin: 16px 16px 0; background: var(--amber-light);
  border-radius: 16px; overflow: hidden; border: 1px solid rgba(245,166,35,0.25);
}
.totals-section .section-title { color: var(--amber-dark); }
.totals-section .field label { color: var(--amber-dark); }
.totals-section input { background: rgba(255,255,255,0.7); border-color: rgba(245,166,35,0.3); }
.totals-section input:focus { background: white; border-color: var(--amber); }
.total-field input { font-weight: 600; font-size: 17px; color: var(--amber-dark); background: white !important; border-color: var(--amber) !important; }

.client-badge {
  margin: 16px 16px 0; padding: 12px 16px;
  background: var(--card); border-radius: 12px; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.client-badge.hidden { display: none; }
.badge-info { flex: 1; }
.badge-name { font-size: 14px; font-weight: 600; }
.badge-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.badge-btn {
  font-size: 12px; color: var(--amber-dark); background: var(--amber-light);
  border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500;
}

.status-bar {
  margin: 12px 16px 0; padding: 10px 14px;
  background: rgba(245,166,35,0.12); border-radius: 10px;
  font-size: 12px; color: var(--amber-dark); text-align: center;
  min-height: 36px; display: flex; align-items: center; justify-content: center;
}
.status-bar.hidden { opacity: 0; pointer-events: none; }

.btn {
  margin: 16px 16px 0; width: calc(100% - 32px); padding: 16px;
  border: none; border-radius: 14px;
  font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: background 0.15s, transform 0.1s;
}
.btn-amber { background: var(--amber); color: white; }
.btn-amber:active { background: var(--amber-dark); transform: scale(0.98); }
.btn-outline { background: var(--card); color: var(--amber-dark); border: 1.5px solid var(--amber); }
.btn-outline:active { background: var(--amber-light); transform: scale(0.98); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 10px; padding: 0 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="lion-icon">🦁</div>
  <div class="header-text">
    <h1>Santiago León</h1>
    <p>Generador de facturas</p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('factura')">📄 Factura</button>
  <button class="tab" onclick="switchTab('cliente')">👤 Cliente</button>
</div>

<!-- TAB: FACTURA -->
<div class="page active" id="page-factura">

  <div class="client-badge hidden" id="client-badge">
    <div class="badge-info">
      <div class="badge-name" id="badge-name">—</div>
      <div class="badge-sub" id="badge-sub"></div>
    </div>
    <button class="badge-btn" onclick="switchTab('cliente')">Cambiar</button>
  </div>

  <div class="section" style="margin-top:16px;">
    <div class="section-title">Datos de factura</div>
    <div class="field">
      <label>Número de factura</label>
      <div class="input-wrap">
        <input type="text" id="num" placeholder="AB-2026-007">
        <button class="mic" id="mic-num" onclick="startVoice('num')"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg></button>
      </div>
    </div>
    <div class="field">
      <label>Fecha de emisión</label>
      <div class="input-wrap">
        <input type="text" id="fecha" placeholder="27/03/2026">
        <button class="mic" id="mic-fecha" onclick="startVoice('fecha')"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg></button>
      </div>
    </div>
    <div class="field">
      <label>Concepto</label>
      <div class="input-wrap">
        <input type="text" id="concepto" placeholder="Servicios de gestión de compras">
        <button class="mic" id="mic-concepto" onclick="startVoice('concepto')"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg></button>
      </div>
    </div>
    <div class="field">
      <label>Precio unitario (€)</label>
      <div class="input-wrap">
        <input type="number" id="precio" placeholder="3318.00" step="0.01" oninput="calcFromPrecio()">
        <button class="mic" id="mic-precio" onclick="startVoice('precio')"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg></button>
      </div>
    </div>
  </div>

  <div class="totals-section">
    <div class="section-title">Totales (editables)</div>
    <div class="field">
      <label>Base imponible (€)</label>
      <input type="number" id="base" placeholder="0.00" step="0.01" oninput="calcFromBase()">
    </div>
    <div class="field">
      <label>IVA 21% (€)</label>
      <input type="number" id="iva" placeholder="0.00" step="0.01" oninput="calcFromIva()">
    </div>
    <div class="field total-field">
      <label>Total a pagar (€)</label>
      <input type="number" id="total" placeholder="0.00" step="0.01">
    </div>
  </div>

  <div class="status-bar hidden" id="status"></div>

  <button class="btn btn-amber" onclick="generatePDF()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    Descargar PDF
  </button>
  <p class="hint">PDF generado en tu dispositivo · Sin servidor</p>
</div>

<!-- TAB: CLIENTE -->
<div class="page" id="page-cliente">
  <div class="section" style="margin-top:16px;">
    <div class="section-title">Datos del cliente</div>
    <div class="field">
      <label>Nombre / Razón social</label>
      <input type="text" id="cli-nombre" placeholder="NEKO-NOMI, S.L.">
    </div>
    <div class="field">
      <label>NIF / CIF / NIE</label>
      <input type="text" id="cli-nif" placeholder="B56937113">
    </div>
    <div class="field">
      <label>Dirección (línea 1)</label>
      <input type="text" id="cli-dir1" placeholder="CTRA. CASTELLON-ALCORA, KM.21">
    </div>
    <div class="field">
      <label>Dirección (línea 2)</label>
      <input type="text" id="cli-dir2" placeholder="12110 ALCORA, SPAIN">
    </div>
  </div>

  <button class="btn btn-amber" onclick="saveCliente()">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    Guardar y volver a factura
  </button>
  <button class="btn btn-outline" style="margin-top:8px;" onclick="clearCliente()">
    Limpiar campos
  </button>
  <p class="hint">Los datos se guardan mientras la app está abierta</p>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// Auto date
const today = new Date();
document.getElementById('fecha').value = today.toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});

// Tabs
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['factura','cliente'][i] === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
}

// Cliente
function saveCliente() {
  const nombre = document.getElementById('cli-nombre').value.trim();
  const nif    = document.getElementById('cli-nif').value.trim();
  if (!nombre) { showStatus('Escribe el nombre del cliente', true); return; }
  document.getElementById('badge-name').textContent = nombre;
  document.getElementById('badge-sub').textContent  = nif ? 'NIF/CIF: ' + nif : '';
  document.getElementById('client-badge').classList.remove('hidden');
  showStatus('✅ Cliente guardado');
  switchTab('factura');
}
function clearCliente() {
  ['cli-nombre','cli-nif','cli-dir1','cli-dir2'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('client-badge').classList.add('hidden');
}

// Calc
function calcFromPrecio() {
  const p = parseFloat(document.getElementById('precio').value) || 0;
  const iv = Math.round(p * 0.21 * 100) / 100;
  const tot = Math.round((p + iv) * 100) / 100;
  document.getElementById('base').value  = p.toFixed(2);
  document.getElementById('iva').value   = iv.toFixed(2);
  document.getElementById('total').value = tot.toFixed(2);
}
function calcFromBase() {
  const b = parseFloat(document.getElementById('base').value) || 0;
  const iv = Math.round(b * 0.21 * 100) / 100;
  document.getElementById('iva').value   = iv.toFixed(2);
  document.getElementById('total').value = (Math.round((b + iv)*100)/100).toFixed(2);
}
function calcFromIva() {
  const b = parseFloat(document.getElementById('base').value) || 0;
  const iv = parseFloat(document.getElementById('iva').value) || 0;
  document.getElementById('total').value = (Math.round((b + iv)*100)/100).toFixed(2);
}

// Voice
let recognition = null, activeField = null;
function startVoice(fieldId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showStatus('Voz no soportada en este navegador', true); return; }
  if (recognition && activeField === fieldId) { recognition.stop(); return; }
  if (recognition) recognition.stop();
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = false;
  activeField = fieldId;
  document.querySelectorAll('.mic').forEach(b => b.classList.remove('listening'));
  document.getElementById('mic-' + fieldId)?.classList.add('listening');
  showStatus('Escuchando...');
  recognition.onresult = (e) => {
    let t = e.results[0][0].transcript.trim();
    if (['precio','base','iva','total'].includes(fieldId)) {
      t = t.replace(/euros?/gi,'').replace(/,/g,'.').replace(/[^\d.]/g,'');
      const n = parseFloat(t); if (!isNaN(n)) t = n.toString();
    }
    document.getElementById(fieldId).value = t;
    if (fieldId==='precio') calcFromPrecio();
    else if (fieldId==='base') calcFromBase();
    else if (fieldId==='iva') calcFromIva();
    showStatus('Listo: ' + t);
  };
  recognition.onerror = (e) => { showStatus('Error: ' + e.error, true); resetMics(); };
  recognition.onend = () => resetMics();
  recognition.start();
}
function resetMics() {
  document.querySelectorAll('.mic').forEach(b => b.classList.remove('listening'));
  recognition = null; activeField = null;
}

function showStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.remove('hidden');
  el.style.color = isErr ? 'var(--red)' : 'var(--amber-dark)';
  el.style.background = isErr ? 'rgba(255,59,48,0.08)' : 'rgba(245,166,35,0.12)';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 3500);
}

// PDF
function generatePDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    showStatus('Cargando PDF, intenta de nuevo...', true);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => showStatus('Listo, pulsa el botón de nuevo');
    document.head.appendChild(s);
    return;
  }

  const num      = document.getElementById('num').value.trim() || 'AB-2026-001';
  const fecha    = document.getElementById('fecha').value.trim() || '';
  const concepto = document.getElementById('concepto').value.trim() || 'Servicios de gestión de compras';
  const precio   = parseFloat(document.getElementById('precio').value) || 0;
  const base     = parseFloat(document.getElementById('base').value) || precio;
  const iva      = parseFloat(document.getElementById('iva').value) || 0;
  const total    = parseFloat(document.getElementById('total').value) || 0;
  const cliNombre = document.getElementById('cli-nombre').value.trim() || '—';
  const cliNif    = document.getElementById('cli-nif').value.trim() || '—';
  const cliDir1   = document.getElementById('cli-dir1').value.trim() || '';
  const cliDir2   = document.getElementById('cli-dir2').value.trim() || '';

  const fmt = n => n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 14;

  // HEADER
  doc.setFillColor(245, 166, 35);
  doc.rect(0, 0, W, 36, 'F');
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(255, 255, 255);
  doc.text('Fecha de emisión: ' + fecha, M, 13);
  doc.text('Factura Nº: ' + num, M, 22);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('SANTIAGO LEON', W - M, 22, { align: 'right' });

  // EMISOR
  let y = 46;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(30,30,30);
  doc.text('Santiago León', M, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(80,80,80);
  doc.text('NIE Y8772642L', M, y); y += 5;
  doc.text('Avenida del Mar, 11, entresuelo B, 12003, Castellón de la Plana, España', M, y); y += 5;
  doc.text('Teléfono: +34 647258332', M, y);

  // DIVIDER
  y += 8;
  doc.setDrawColor(220,220,220); doc.setLineWidth(0.3);
  doc.line(M, y, W-M, y);

  // TWO COLUMNS
  y += 10;
  const col2 = 112;
  doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(196,127,10);
  doc.text('Datos del emisor (Autónomo):', M, y);
  doc.text('Datos del cliente:', col2, y);
  y += 8;

  const lv = (x, yy, label, value) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(30,30,30);
    doc.text(label, x, yy);
    doc.setFont('helvetica','normal');
    doc.text(String(value), x + doc.getTextWidth(label) + 1, yy);
  };

  lv(M,    y, 'Forma de pago: ', 'Transferencia bancaria');
  lv(col2, y, 'Nombre: ', cliNombre);
  y += 6;
  lv(M,    y, 'IBAN: ', 'ES46 0182 5319 7702 0284 0648');
  lv(col2, y, 'NIF/CIF: ', cliNif);
  y += 6;
  lv(M,    y, 'BIC: ', 'BBVAESMM');
  if (cliDir1) lv(col2, y, 'Dirección: ', cliDir1);
  y += 6;
  lv(M,    y, 'Plazo de pago: ', '45 días');
  if (cliDir2) { doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(30,30,30); doc.text(cliDir2, col2, y); }

  // CONCEPTO
  y += 14;
  doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(196,127,10);
  doc.text('Concepto:', M, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setTextColor(100,100,100);
  doc.text(concepto, M, y);

  // ITEMS TABLE
  y += 12;
  const rH = 9;

  // Header
  doc.setFillColor(245,166,35);
  doc.rect(M, y, W-2*M, rH, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
  doc.text('Nº',          M+2,    y+6);
  doc.text('Concepto',    M+10,   y+6);
  doc.text('Cant.',       M+103,  y+6);
  doc.text('Precio unit.',M+120,  y+6);
  doc.text('Total',       M+158,  y+6);

  // Row
  y += rH;
  doc.setFillColor(254,243,220);
  doc.rect(M, y, W-2*M, rH, 'F');
  doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
  doc.text('1',                         M+2,   y+6);
  doc.text(doc.splitTextToSize(concepto,88)[0], M+10, y+6);
  doc.text('1',                         M+106, y+6);
  doc.text(fmt(precio),                 M+120, y+6);
  doc.text(fmt(precio),                 M+158, y+6);

  // Empty row
  y += rH;
  doc.setDrawColor(210,210,210); doc.setLineWidth(0.2);
  doc.rect(M, y, W-2*M, rH);

  // TOTALS TABLE
  y += rH + 8;

  doc.setFillColor(245,166,35);
  doc.rect(M, y, W-2*M, rH, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
  doc.text('Nº',              M+2,   y+6);
  doc.text('Base imponible:', M+10,  y+6);
  doc.text('IVA 21%:',        M+78,  y+6);
  doc.text('Total a pagar:',  M+138, y+6);

  y += rH;
  doc.setFillColor(254,243,220);
  doc.rect(M, y, W-2*M, rH, 'F');
  doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
  doc.text('1',       M+2,   y+6);
  doc.text(fmt(base), M+10,  y+6);
  doc.text(fmt(iva),  M+78,  y+6);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(196,127,10);
  doc.text(fmt(total),M+138, y+6);

  y += rH;
  doc.setDrawColor(210,210,210);
  doc.rect(M, y, W-2*M, rH);

  // FOOTER
  y += rH + 18;
  doc.setDrawColor(220,220,220); doc.line(M, y, W-M, y);
  y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
  doc.text('Santiago León · NIE Y8772642L · Av. del Mar 11, entresuelo B, 12003 Castellón · Tel: +34 647258332', W/2, y, {align:'center'});

  // SAVE
  const filename = 'Factura_' + num.replace(/[^a-zA-Z0-9\-]/g,'_') + '_' + fecha.replace(/\//g,'-') + '.pdf';
  try {
    doc.save(filename);
    showStatus('✅ PDF descargado');
  } catch(e) {
    const url = URL.createObjectURL(doc.output('blob'));
    window.open(url, '_blank');
    showStatus('✅ PDF abierto en nueva pestaña');
  }
}
</script>
</body>
</html>
